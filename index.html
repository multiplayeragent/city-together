<script type="module">
/* ═══ CITY TOGETHER · a Multiplayer Agent starter ════════════════════════════════════════
 * Build a little town together and watch it grow. Co-op, 1–8 players; AI mayors build beside you.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ map size, prices, growth, taxes, milestones, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host, live ops
 *   MAP ........... what each map letter means, what each tool turns a tile into, the start map
 *   WORLD MEMORY .. how the town survives the room emptying (same code in every starter)
 *   TOWN (HOST) ... checking builds, growing lots, daily taxes, writing the shared fields
 *   MAYORS (HOST) . AI mayors: a street plan, zoning next to roads, parks now and then
 *   SCENE ......... ground, river, roads, lots, houses, shops, towers, parks, trees
 *   LIFE .......... cars on the roads, people on the pavements, pop-in and dust when lots grow
 *   ME ............ the tool, painting tiles, my cursor, the camera
 *   HUD ........... money, population, demand bars, milestones, stats, leaderboard
 *   INPUT ......... mouse, touch (one finger builds, two fingers move), keyboard
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `cur` (the tile it points at and its tool, ~8 times a
 *     second), `n`/`c` (name, color) once and `hb` (heartbeat) once a second.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields: `city` (the whole map,
 *     one letter per tile), `stats` (money, day, population, jobs, best population, rev and the
 *     next payday) and `bots` (the AI mayors' cursors). A new host adopts all three.
 *   - Everyone else sends intents: "build" {t, cells}. The host checks the tool, the tiles and
 *     the money, then writes the map. Your own tiles show at once (a "pending" copy) until the
 *     host's write comes back.
 *   - Growth and taxes are the host's: it rolls which lots grow each tick, so there is one
 *     town, not one per screen. Paydays are timestamps in `stats`.
 *   - The town outlives the room through WORLD MEMORY (see that section).
 *   - Leaderboard "city-pop": the biggest population each player has seen their town reach.
 *   - Live ops: `growth` and `taxes` multiply growth and income; running events show top right.
 *   - ?attract plays offline with AI mayors only (the preview video is recorded from it).
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  size: 24,                // the map is size × size tiles
  tile: 2,                 // world units per tile
  startMoney: 1500,
  cost: { road: 10, bridge: 30, home: 10, shop: 15, park: 30, bulldoze: 0 },
  tickMs: 1000,            // lots may grow once a tick
  maxGrow: 6,              // most lots that grow in one tick
  dayMs: 10000,            // taxes come in once a day
  baseIncome: 10,          // the town's daily grant, on top of taxes
  growth: 1,               // live ops: multiplies how fast lots grow
  taxes: 1,                // live ops: multiplies the daily income
  residents: [0, 5, 14, 32], // people in a home, by level (0 = an empty lot)
  jobs: [0, 4, 12, 28],      // jobs in a shop, by level
  milestones: [[0, "Hamlet"], [50, "Village"], [200, "Town"], [500, "City"], [1000, "Big City"], [2000, "Metropolis"]],
  seats: 3,                // AI mayors fill the team up to this many builders
  botEveryMs: 700,         // ms between an AI mayor's builds
  botReserve: 250,         // money the AI mayors leave for each person
  board: "city-pop",
  saveNs: "city-together", // player-save namespace for world memory
  saveEvery: 10000,        // ms between world-memory saves
};
const COLORS = ["#ff5a5f", "#3fa7ff", "#ffc93c", "#5ad15a", "#b57bff", "#ff8a3d", "#ff6fb5", "#36d6c6"];
const BOT_NAMES = ["Mayor Bea", "Mayor Ozzy", "Mayor Pim", "Mayor Lou", "Mayor Kit", "Mayor Sol"];
const TOOLS = [
  { id: "look", icon: "✋", name: "Move" }, { id: "road", icon: "🛣️", name: "Road" }, { id: "home", icon: "🏠", name: "Homes" },
  { id: "shop", icon: "🏪", name: "Shops" }, { id: "park", icon: "🌳", name: "Park" }, { id: "bulldoze", icon: "💥", name: "Clear" },
];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'city-together',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
const TEST = new URLSearchParams(location.search).has("test");
if (ATTRACT) Object.assign(CONFIG, { seats: 3, botEveryMs: 300, tickMs: 450, maxGrow: 2 });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true, live: { config: {}, active: [] },
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {}, onLive() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback) { const raw = S.shared[key], m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fallback); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} }, reconnecting = false;
let player = null; // MP.auth client: world-memory saves and the leaderboard (null offline)
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let hostHold = 0, lastTick = performance.now(); // lastTick: when frame() last ran; hostHold: after a freeze, no hosting before this time (see frame())
const isHost = () => performance.now() > hostHold && performance.now() - lastTick < 1000 && livePlayers()[0] === net.sessionId; // a tab whose loop has stopped doesn't host
/** A live-ops tunable: the owner's live config if it has one of the right type, else CONFIG. */
function liveCfg(k) { const v = net && net.live && net.live.config ? net.live.config[k] : undefined; return typeof v === typeof CONFIG[k] ? v : CONFIG[k]; }
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rnd = (a, b) => a + Math.random() * (b - a), pick = (list) => list[Math.floor(Math.random() * list.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ── MAP ─────────────────────────────────────────────────────────────────────────────
// One letter per tile, row by row (tile k = i + j × N). Never digits: they'd come back as numbers.
//   "." grass  "t" tree  "w" water  "r" road  "q" bridge  "p" park
//   homes: "a" empty lot, "b" "c" "d" levels 1–3     shops: "e" empty lot, "f" "g" "h" levels 1–3
const N = CONFIG.size, T = CONFIG.tile, HALF = (N * T) / 2;
const HOME = "abcd", SHOP = "efgh";
const isRoad = (c) => c === "r" || c === "q";
const lvl = (c) => (HOME.includes(c) ? HOME.indexOf(c) : SHOP.includes(c) ? SHOP.indexOf(c) : -1);
const cellX = (i) => (i + 0.5) * T - HALF, cellZ = (j) => (j + 0.5) * T - HALF;
const inMap = (i, j) => i >= 0 && j >= 0 && i < N && j < N;
/** What tool `t` turns a tile holding `c` into, or null if it can't go there. */
function result(t, c) {
  if (t === "road") return c === "." || c === "t" || c === "a" || c === "e" ? "r" : c === "w" ? "q" : null;
  if (t === "home") return c === "." || c === "t" || c === "e" ? "a" : null;
  if (t === "shop") return c === "." || c === "t" || c === "a" ? "e" : null;
  if (t === "park") return c === "." || c === "t" || c === "a" || c === "e" ? "p" : null;
  if (t === "bulldoze") return c === "q" ? "w" : c === "." || c === "w" ? null : ".";
  return null;
}
const costOf = (t, c) => (t === "road" && c === "w" ? CONFIG.cost.bridge : CONFIG.cost[t] || 0);
/** A tile has a road on one of its eight neighbours (lots need that to grow). */
function nearRoad(g, i, j) { for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) if ((di || dj) && inMap(i + di, j + dj) && isRoad(g[i + di + (j + dj) * N])) return true; return false; }
/** How many tiles within `r` of (i, j) hold one of the letters in `set`. */
function countNear(g, i, j, r, set) { let n = 0; for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) if (inMap(i + di, j + dj) && set.includes(g[i + di + (j + dj) * N])) n++; return n; }
/** Population and jobs on a map. */
function census(g) {
  let pop = 0, jobs = 0, roads = 0, parks = 0;
  for (const c of g) { if (HOME.includes(c)) pop += CONFIG.residents[HOME.indexOf(c)]; else if (SHOP.includes(c)) jobs += CONFIG.jobs[SHOP.indexOf(c)]; else if (isRoad(c)) roads++; else if (c === "p") parks++; }
  return { pop, jobs, roads, parks };
}
/** The map a new town starts with: a river, trees, and one road in from the west. */
function startMap() {
  const g = Array(N * N).fill("."), s = mulberry32(5);
  for (let j = 0; j < N; j++) { const c = Math.round(N * 0.7 + Math.sin(j / 3.5) * 1.6); g[c + j * N] = g[c + 1 + j * N] = "w"; }
  for (let k = 0; k < 90; k++) { const i = Math.floor(s() * N), j = Math.floor(s() * N); if (g[i + j * N] === "." && (Math.abs(i - 11) > 4 || Math.abs(j - 12) > 4)) g[i + j * N] = "t"; }
  for (let i = 0; i <= 11; i++) g[i + 12 * N] = "r";
  return g;
}

// ── WORLD MEMORY ────────────────────────────────────────────────────────────────────
// A relay room forgets everything when its last player leaves, so the PLAYERS remember the town:
//   1. Every CONFIG.saveEvery ms and when the page closes, each player saves a copy of the live
//      town with its `rev` (how many tiles PEOPLE changed; AI mayors don't count, so a fresh town
//      full of their streets never beats a saved one) to its player save (player.data, namespace
//      CONFIG.saveNs) and to this browser (localStorage). A copy with a higher rev than the live
//      town is never overwritten: it is kept and offered.
//   2. The first player into an empty room becomes host and loads its copy into shared.
//   3. A player who joins holding a copy with a HIGHER rev than the live town offers it: it
//      writes the copy into its own entity (`wmh` header, `wm0`, `wm1`… chunks under 2048
//      characters) and the host adopts it. The copy with more building in it wins; changes
//      made only in the other copy are lost.
// The game supplies worldSnapshot(), liveRev() (-1 = no town yet) and loadWorld(world, rev).
const memory = { saved: null, ready: false, cloud: null, lastJson: "", lastSave: 0, offerRev: 0, offerN: 0 };
const memoryKey = () => "mpa-world:" + MP_CONNECT.room + (net.offline ? ":offline" : "");

/** Read my copy: this browser's and my cloud save, whichever has the higher rev. */
async function loadMemory() {
  let best = null;
  try { best = JSON.parse(localStorage.getItem(memoryKey()) || "null"); } catch {}
  if (player) {
    try {
      const doc = (await player.data.get(CONFIG.saveNs)).data;
      if (doc && doc.room === MP_CONNECT.room && doc.world && (!best || doc.rev > best.rev)) best = doc;
      memory.cloud = true;
    } catch (e) { memory.cloud = false; console.warn("World memory: no cloud save, this browser only:", e && e.message); }
  }
  memory.saved = best && best.room === MP_CONNECT.room && best.world && typeof best.rev === "number" ? best : null;
  memory.lastJson = memory.saved ? JSON.stringify(memory.saved.world) : "";
  memory.ready = true;
}

/** Save my copy of the live town, unless it is unchanged or older than the copy I hold. */
function rememberWorld() {
  if (ATTRACT || !memory.ready) return;
  const rev = liveRev();
  if (rev < 0 || (memory.saved && rev < memory.saved.rev)) return; // mine is newer: keep it, keep offering it
  const doc = { room: MP_CONNECT.room, rev, at: Date.now(), world: worldSnapshot() };
  const json = JSON.stringify(doc.world);
  if (json === memory.lastJson) return;
  memory.lastJson = json; memory.saved = doc;
  try { localStorage.setItem(memoryKey(), JSON.stringify(doc)); } catch {}
  if (player && memory.cloud) {
    player.data.set(doc, { namespace: CONFIG.saveNs })
      .catch((e) => e && e.current ? player.data.set(doc, { namespace: CONFIG.saveNs, version: e.current.version }) : Promise.reject(e))
      .catch((e) => { if (e && (e.status === 401 || e.status === 403)) memory.cloud = false; });
  }
  const tag = document.getElementById("saved");
  if (tag) { tag.classList.add("on"); setTimeout(() => tag.classList.remove("on"), 1600); }
}

/** Once a second: offer my copy if it beats the live town (the host simply loads it). */
function offerMemory() {
  if (ATTRACT || !memory.ready) return;
  const mine = memory.saved, live = liveRev(), better = mine && mine.rev > live;
  if (isHost()) {
    if (memory.offerRev) clearOffer();
    if (better && live >= 0 && loadWorld(mine.world, mine.rev)) memoryAdopted("");
    return;
  }
  if (better && memory.offerRev !== mine.rev) {
    const json = JSON.stringify(mine.world), fields = {}, n = Math.ceil(json.length / 1900);
    if (n > 40) return; // too big for my entity: keep it for when I am host
    for (let i = 0; i < n; i++) fields["wm" + i] = "~" + json.slice(i * 1900, (i + 1) * 1900); // "~" keeps it a string
    net.me.set(fields);
    net.me.set("wmh", JSON.stringify({ room: MP_CONNECT.room, rev: mine.rev, n })); // header last: chunks land first
    memory.offerRev = mine.rev; memory.offerN = n;
  } else if (!better && memory.offerRev) clearOffer();
}
function clearOffer() {
  const fields = { wmh: "" };
  for (let i = 0; i < memory.offerN; i++) fields["wm" + i] = "";
  net.me.set(fields); memory.offerRev = 0; memory.offerN = 0;
}

/** Host, once a second: adopt the best complete offer that beats the live town. */
function adoptOffers() {
  let best = null;
  for (const id of livePlayers()) {
    const p = S.entities.players[id], h = id !== net.sessionId && parse(p && p.wmh, null);
    if (!h || h.room !== MP_CONNECT.room || !(h.n <= 40) || !(h.rev > liveRev()) || (best && h.rev <= best.rev)) continue;
    let json = "";
    for (let i = 0; i < h.n && json !== null; i++) { const c = p["wm" + i]; json = typeof c === "string" && c[0] === "~" ? json + c.slice(1) : null; }
    const world = parse(json, null);
    if (world) best = { rev: h.rev, world, name: p.n || "A player" };
  }
  if (best && loadWorld(best.world, best.rev)) memoryAdopted(best.name);
}
function memoryAdopted(name) {
  const text = name ? `${name} brought back the town they saved` : "Welcome back: your saved town is loaded";
  toast(text); net.send("memory", { text: name ? text : "The host brought back the town they saved" });
}

let last = performance.now(), lastHb = 0, lastHud = 0;

(async function start() {
